[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83Extensions.curl", "php83Extensions.openssl", "php83Extensions.gmp", "php83Extensions.mbstring", "php83Extensions.pdo", "php83Extensions.pdo_sqlite", "php83Extensions.sqlite3"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
cmd = "php -S 0.0.0.0:$PORT -t ."
